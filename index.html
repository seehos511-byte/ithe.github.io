<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTRPG Character Sheet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div id="image-container">
                <img id="char-img" src="https://via.placeholder.com/400" alt="Character">
            </div>
            <input type="file" id="img-input" accept="image/*" style="display:none">
            <label for="img-input" class="upload-btn">Change Portrait</label>
        </aside>

        <main class="main-content">
            <header class="char-header">
                <input type="text" id="char-name" placeholder="CHARACTER NAME" class="name-input">
                <div class="level-container">
                    <span>LVL</span>
                    <input type="text" id="char-level" placeholder="1" class="lvl-input">
                </div>
            </header>

            <section class="stats-row">
                <div class="stat-card"><span>STR</span><input type="text" value="10"></div>
                <div class="stat-card"><span>DEX</span><input type="text" value="10"></div>
                <div class="stat-card"><span>CON</span><input type="text" value="10"></div>
                <div class="stat-card"><span>INT</span><input type="text" value="10"></div>
                <div class="stat-card) scale"><span>WIS</span><input type="text" value="10"></div>
                <div class="stat-card"><span>CHA</span><input type="text" value="10"></div>
            </section>

            <section class="skills-section">
                <div class="section-header">
                    <h3>Proficiencies & Languages</h3>
                    <button onclick="addItem('skills-list', 'Skill/Lang')">+ ADD</button>
                </div>
                <div id="skills-list" class="tag-cloud"></div>
            </section>

            <section class="detail-grid">
                <div class="box gear-box">
                    <h3>Equipped Gear</h3>
                    <button onclick="addComplexItem('gear-list', 'Item Name', 'Item Description')">+ Add Item</button>
                    <div id="gear-list" class="list-container"></div>
                </div>

                <div class="box passive-box">
                    <h3>Passives</h3>
                    <button onclick="addComplexItem('passive-list', 'Passive Name', 'Effect')">+ Add Passive</button>
                    <div id="passive-list" class="list-container"></div>
                </div>

                <div class="box ability-box">
                    <h3>Abilities</h3>
                    <button onclick="addItem('ability-list', 'Ability Name')">+ Add Ability</button>
                    <div id="ability-list" class="list-container"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-desc"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
